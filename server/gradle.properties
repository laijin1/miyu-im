# 关键：非 ASCII 项目路径 + 测试 worker 的 @argfile 编码一致性。
# 原做法是让 daemon 用 GBK 写 argfile 以对齐 java.exe 启动器按系统 ANSI 码页读取的行为，
# 但本环境 file.encoding 已由 JAVA_TOOL_OPTIONS 固定为 UTF-8，强制 GBK 反而让测试 worker
# 加载 sqlite-jdbc 原生库失败（24/24 全挂，报
# java.lang.UnsatisfiedLinkError: 'void org.sqlite.core.NativeDB._open_utf8(byte[], int)'）。
# 实测改为 UTF-8 后整套单测 24/24 通过；源码编译仍显式使用 UTF-8（见 build.gradle）。
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8
