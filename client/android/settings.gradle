pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        // uCrop 2.2.8 is hosted on JitPack (not Maven Central)
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "FamilyChat"
include ':app'
include ':core'
include ':ui-common'
include ':feature-wallet'
include ':feature-mall'
include ':feature-chat'
include ':feature-group'
