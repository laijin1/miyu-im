org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 模块化架构必须用"合并 R"行为：app 的 R 类需能看到 :ui-common / :core 等库模块的资源
# （true 会让 app 的 R 只含自身资源，代码里 R.color/… 引用库资源会全部编译失败）
android.nonTransitiveRClass=false

# ── 以下两项是为"中文工程路径"准备的历史兼容项，现已不需要 ──
# 工程已迁到纯 ASCII 路径（<本地路径>），因此：
#   * 不再需要 android.overridePathCheck 绕过路径校验；
#   * 不再需要抬高 cmdline.max.length —— 之前 Gradle 会把 classpath 写进 @argfile，
#     而 JDK 按 sun.jnu.encoding(GBK) 解析该文件，导致 "<本地路径>\..." 变乱码、
#     单元测试必然 ClassNotFoundException。路径改 ASCII 后，argfile 内容全是 ASCII，
#     gradlew testDebugUnitTest 已可直接使用（实测 52 个用例全部通过）。
# 保留这两行无害（overridePathCheck 对 ASCII 路径是空操作），但若你想彻底清干净，
# 可以删掉下面两行并验证 `gradlew testDebugUnitTest` 仍然通过。
android.overridePathCheck=true
org.gradle.internal.cmdline.max.length=1000000
