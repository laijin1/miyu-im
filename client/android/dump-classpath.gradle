// 打印各模块单元测试的真实 classpath（不含 @argfile），供 run-unit-tests.ps1 使用。
//
// 背景（历史，已解决）：本工程原先位于含中文的路径（<本地路径>）。Gradle 在命令行过长时
// 会把 classpath 写进 @argfile（UTF-8），而 JDK 按 sun.jnu.encoding(GBK) 读它，
// 含中文的路径就变成乱码 → 测试 worker 报 ClassNotFoundException（编译其实是成功的）。
// 当时靠"绕开 Gradle 的 test 任务、用 java -cp 直接跑 JUnitCore"来规避。
//
// 现工程已迁到纯 ASCII 路径（<本地路径>），`gradlew testDebugUnitTest`
// 已可直接使用。本文件保留给 run-unit-tests.ps1：它额外提供逐模块汇总、关键用例
// 存在性检查，并能防止"旧 classes.jar 抢占新代码"这类问题（见下方 dependsOn）。
allprojects { p ->
    p.tasks.register('dumpTestClasspath') { t ->
        // 强制先重建"主代码产物"，否则 classpath 里的旧 classes.jar 会抢先加载，
        // 表现为"改了代码但测试结果没变"（本文件曾因此漏掉一次真实缺陷）。
        // 库模块：bundleLibRuntimeToJarDebug
        // application 模块（:app）：bundleDebugClassesToRuntimeJar —— 刻意不用 assembleDebug，
        //   因为 assembleDebug 会依赖 validateSigningDebug（需要写 ~/.gradle 之外的调试密钥库），
        //   在受限环境/无调试密钥时会失败，而跑单测根本不需要签名。
        def own = p.tasks.findByName('bundleLibRuntimeToJarDebug')
        if (own == null) own = p.tasks.findByName('bundleDebugClassesToRuntimeJar')
        if (own != null) t.dependsOn own

        // 关键：本模块的 classpath 会引用"其它模块"的 classes.jar（如 :app 依赖 :core）。
        // 若只重建自己的产物，被依赖模块的旧 jar 仍会抢先命中，导致改动测不出来。
        // 因此把所有 project 依赖的打包任务也加入依赖。
        p.configurations.findByName('debugRuntimeClasspath')?.allDependencies?.each { dep ->
            if (dep instanceof org.gradle.api.artifacts.ProjectDependency) {
                def dp = dep.dependencyProject
                def dt = dp.tasks.findByName('bundleLibRuntimeToJarDebug')
                if (dt == null) dt = dp.tasks.findByName('bundleDebugClassesToRuntimeJar')
                if (dt != null) t.dependsOn dt
            }
        }

        doLast {
            def testTask = p.tasks.findByName('testDebugUnitTest')
            if (testTask == null) return
            def out = new File(p.rootProject.projectDir, "build/testcp-${p.name}.txt")
            out.parentFile.mkdirs()
            def sb = new StringBuilder()
            testTask.testClassesDirs.each { sb.append(it.absolutePath).append('\n') }
            sb.append('---CP---\n')
            testTask.classpath.each { sb.append(it.absolutePath).append('\n') }
            out.text = sb.toString()
            println "wrote ${out.absolutePath}"
        }
    }
}
