# 密语 服务端 —— Nginx + TLS 反向代理（DEPLOY.md 路线 B）
#
# 用法：
#   sudo cp deploy/nginx-miyu.conf /etc/nginx/sites-available/miyu
#   sudo ln -s /etc/nginx/sites-available/miyu /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d chat.你的域名      # 自动填好证书路径并跳转 80->443
#
# 把下面所有 chat.你的域名 换成你的真实域名。

server {
    listen 80;
    listen [::]:80;
    server_name chat.你的域名;
    # certbot 会自动把这里改成 301 跳转到 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.你的域名;

    # 由 certbot --nginx 自动写入
    ssl_certificate     /etc/letsencrypt/live/chat.你的域名/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.你的域名/privkey.pem;

    # 服务端 max.request.size = 100MB，这里不能更小，否则大视频被 nginx 拦掉
    client_max_body_size 100M;

    # 大文件上传/下载 + 长轮询：超时给足
    proxy_read_timeout    3600s;
    proxy_send_timeout    3600s;
    proxy_connect_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # ---- WebSocket（/ws）必需 ----
        # 少了这两行，实时消息和通话信令会连不上（握手失败退回轮询或直接报错）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 下载 APK / 视频必需 ----
        # 服务端手动设置了 Content-Length 用于下载进度，nginx 缓冲会破坏这一点
        # （客户端会报 "unexpected end of stream"）
        proxy_buffering         off;
        proxy_request_buffering off;
    }
}
